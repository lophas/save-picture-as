name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/smoke.mjs
        timeout-minutes: 3
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: save-picture-as
          path: dist/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: save-picture-as
          path: dist
      - name: Publish release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag does not match manifest version" >&2
            exit 1
          fi
          gh release create "$TAG" "dist/save-picture-as-$VERSION.zip" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Save picture as $TAG" --notes-file "release-notes/$TAG.md"
